name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throw-away database of the CI job. Tests derive `app_ci_test` and `app_ci_e2e` from it.
      DATABASE_URL: postgresql://app:ci-only-password@127.0.0.1:5432/app_ci
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
